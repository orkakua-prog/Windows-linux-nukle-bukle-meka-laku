name: Linux VNC over Tailscale

on:
  workflow_dispatch:

jobs:
  vnc-runner:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install desktop and VNC packages
        run: |
          sudo apt-get update
          sudo apt-get install -y xfce4 xfce4-goodies tigervnc-standalone-server dbus-x11 x11-apps

      - name: Setup Tailscale
        uses: tailscale/github-action@v4
        with:
          auth_key: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      - name: Configure VNC server
        run: |
          mkdir -p ~/.vnc
          echo "password" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd
          
          # Start XFCE desktop session via vncserver
          vncserver :1 -geometry 1280x800 -depth 24
          
      - name: Keep workflow alive and inspect status
        run: |
          echo "VNC server running on IP: $(tailscale ip -4):5901"
          echo "Password is: password"
          # Sleep for the desired debug duration (max job timeout applies)
          sleep 3600
